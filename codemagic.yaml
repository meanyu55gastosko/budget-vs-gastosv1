workflows:
  budget-vs-gastos-apk:
    name: Gastos Ko APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: FIX - Regenerate Android and Restore Code + Icon + Name
        script: |
          echo "=== BACKUP LIB CODE ==="
          ls -la lib/
          cat lib/main.dart | head -20
          echo "=== RESTORE ASSETS AND PUBSPEC ==="
          git checkout HEAD -- assets/ pubspec.yaml 2>/dev/null || git checkout main -- assets/ pubspec.yaml || true
          ls -lh assets/icon.png
          echo "=== DELETING OLD ANDROID ==="
          rm -rf android
          rm -rf ~/.gradle/wrapper/dists/
          echo "=== GENERATING NEW ANDROID ==="
          flutter create --platforms=android --org com.gastosko.app --project-name budget_vs_gastosv1 .
          echo "=== RESTORING YOUR BUDGET APP FROM GIT ==="
          git checkout HEAD -- lib/ pubspec.yaml || git restore --source=HEAD lib/ pubspec.yaml || true
          git checkout c5f9933 -- lib/ || true
          git checkout HEAD -- assets/ || true
          echo "=== CHECK IF RESTORED ==="
          ls -la lib/
          cat lib/main.dart | head -30
          echo "=== FORCE DOWNGRADE AGP 9 -> 8.7.3 PARA GREEN ==="
          rm -f android/settings.gradle
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.12-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          EOF
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G
          android.useAndroidX=true
          android.enableJetifier=true
          android.newDsl=false
          EOF
          cat > android/settings.gradle.kts <<'EOF'
          pluginManagement {
              val flutterSdkPath = {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties or not set to a valid SDK path." }
                  flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
          }
          include(":app")
          EOF
          echo "=== SET APP NAME TO Gastos Ko ==="
          sed -i '' 's/android:label="[^"]*"/android:label="Gastos Ko"/' android/app/src/main/AndroidManifest.xml 2>/dev/null || sed -i 's/android:label="[^"]*"/android:label="Gastos Ko"/' android/app/src/main/AndroidManifest.xml
          grep label android/app/src/main/AndroidManifest.xml
          echo "=== SET ICON FROM assets/icon.png ==="
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            min_sdk_android: 21
          EOF
          flutter pub add flutter_launcher_icons --dev 2>/dev/null || true
          flutter pub get
          dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons || true
          ls android/app/src/main/res/mipmap-hdpi/ic_launcher.png && echo "ICON OK!"
          echo "=== FINAL VERIFY ==="
          cat android/gradle/wrapper/gradle-wrapper.properties | grep distributionUrl
          cat android/settings.gradle.kts | grep com.android.application
      - name: Get Flutter packages
        script: |
          flutter clean
          flutter pub get
      - name: Build Protected APK
        script: |
          flutter build apk --release --obfuscate --split-debug-info=./symbols --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
