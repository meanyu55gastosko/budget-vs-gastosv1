workflows:
  budget-vs-gastos-apk:
    name: Budget vs Gastos APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: FIX AGP 9 - Downgrade to 8.7.3
        script: |
          echo "=== BEFORE FIX ==="
          cat android/gradle/wrapper/gradle-wrapper.properties || true
          echo "distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.12-all.zip
          networkTimeout=10000
          validateDistributionUrl=true" > android/gradle/wrapper/gradle-wrapper.properties
          echo "org.gradle.jvmargs=-Xmx4G
          android.useAndroidX=true
          android.enableJetifier=true
          android.newDsl=false" > android/gradle.properties
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement {
              val flutterSdkPath = {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties or not set to a valid SDK path." }
                  flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
          }
          include(":app")
          EOF
          echo "=== AFTER FIX - SHOULD BE 8.12 and 8.7.3 ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle.properties
          cat android/settings.gradle.kts
      - name: Get Flutter packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK with Flutter
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
