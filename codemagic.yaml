workflows:
  budget-vs-gastosv1:
    name: Budget vs Gastos APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: FIX AGP 9 - Regenerate Android
        script: |
          echo "=== BEFORE ==="
          ls -la android/
          cat android/settings.gradle.kts || cat android/settings.gradle || echo "no settings file"
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== DELETING OLD ANDROID ==="
          rm -rf android
          echo "=== REGENERATING ANDROID WITH FLUTTER CREATE ==="
          flutter create --platforms=android --org com.gastosko.app --project-name budget_vs_gastosv1 . --overwrite
          echo "=== AFTER REGENERATE ==="
          cat android/settings.gradle.kts
          cat android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle.properties
      - name: Get Flutter packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK with Flutter
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
