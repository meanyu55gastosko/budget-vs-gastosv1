workflows:
  budget-vs-gastos-apk:
    name: Budget vs Gastos APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: FIX - Regenerate Android and Restore Code
        script: |
          echo "=== BACKUP LIB CODE ==="
          ls -la lib/
          cat lib/main.dart | head -20
          echo "=== DELETING OLD ANDROID ==="
          rm -rf android
          echo "=== GENERATING NEW ANDROID ==="
          flutter create --platforms=android --org com.gastosko.app --project-name budget_vs_gastosv1 . 
          echo "=== RESTORING YOUR BUDGET APP FROM GIT ==="
          git checkout HEAD -- lib/ pubspec.yaml || git restore --source=HEAD lib/ pubspec.yaml || true
          git checkout c5f9933 -- lib/ || true
          echo "=== CHECK IF RESTORED ==="
          ls -la lib/
          cat lib/main.dart | head -30
      - name: Get Flutter packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK with Flutter
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
