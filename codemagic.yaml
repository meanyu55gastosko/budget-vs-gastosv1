workflows:
  budget-vs-gastos-apk:
    name: Gastos Ko APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set App Name and Icon
        script: |
          sed -i 's/android:label="[^"]*"/android:label="Gastos Ko"/' android/app/src/main/AndroidManifest.xml || true
          flutter pub add flutter_launcher_icons --dev || true
          echo 'flutter_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"' > flutter_launcher_icons.yaml
          flutter pub get
          dart run flutter_launcher_icons || true
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
